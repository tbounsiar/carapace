[package]
name = "carapace"
version = "0.1.0"
description = "Desktop SSH/SFTP client"
authors = ["Tahar BOUNSIAR"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "carapace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "fs", "net", "io-util"] }
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
zeroize = "1.9.1"
keyring = "4.2.0"
secrecy = { version = "0.10.3", features = ["serde"] }
russh-sftp = "3.0.1"

[dev-dependencies]
rand = "0.10"
sha2 = "0.11.1"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
