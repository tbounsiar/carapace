name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do not file them here, see SECURITY.md.
        Never paste passwords, passphrases, private keys or real hostnames you do not want to make public.
  - type: input
    id: version
    attributes:
      label: Carapace version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: SSH server (if relevant)
      placeholder: OpenSSH 9.6 on Ubuntu 24.04
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
