<p class="content">{{ 'externalEditor.notice.text' | transloco }}</p>
<label tuiLabel class="option">
  <input
    tuiCheckbox
    type="checkbox"
    size="s"
    data-testid="ext-notice-dont-show"
    [formControl]="dontShow"
  />
  {{ 'externalEditor.notice.dontShow' | transloco }}
</label>
<footer class="buttons">
  <button
    tuiButton
    size="m"
    appearance="flat"
    type="button"
    data-testid="ext-notice-cancel"
    (click)="context.$implicit.complete()"
  >
    {{ 'common.cancel' | transloco }}
  </button>
  <button
    tuiAutoFocus
    tuiButton
    size="m"
    appearance="primary"
    type="button"
    data-testid="ext-notice-continue"
    (click)="continue()"
  >
    {{ 'externalEditor.notice.continue' | transloco }}
  </button>
</footer>
