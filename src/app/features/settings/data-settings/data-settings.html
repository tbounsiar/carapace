<fieldset class="group">
  <legend class="legend" data-testid="settings-data">
    {{ 'settings.data.title' | transloco }}
  </legend>
  <p class="note">
    @if (nothingToExport()) {
      {{ 'settings.data.nothing' | transloco }}
    } @else {
      {{ 'settings.data.note' | transloco }}
    }
  </p>
  <div class="buttons">
    <button
      tuiButton
      size="s"
      appearance="secondary"
      iconStart="@tui.download"
      type="button"
      data-testid="settings-export"
      [disabled]="loading() || nothingToExport()"
      (click)="exportData()"
    >
      {{ 'settings.data.export' | transloco }}
    </button>
    <button
      tuiButton
      size="s"
      appearance="secondary"
      iconStart="@tui.upload"
      type="button"
      data-testid="settings-import"
      [disabled]="loading()"
      [loading]="importing()"
      (click)="importData()"
    >
      {{ 'settings.data.import' | transloco }}
    </button>
  </div>
</fieldset>
