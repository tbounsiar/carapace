<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <tui-textfield>
      <label tuiLabel>Name</label>
      <input tuiAutoFocus tuiInput formControlName="name" data-testid="host-name" />
    </tui-textfield>
    <tui-error formControlName="name" />
  </div>

  <div class="address">
    <div>
      <tui-textfield>
        <label tuiLabel>Hostname</label>
        <input tuiInput class="mono" formControlName="hostname" data-testid="host-hostname" />
      </tui-textfield>
      <tui-error formControlName="hostname" />
    </div>
    <div>
      <tui-textfield>
        <label tuiLabel>Port</label>
        <input
          tuiInputNumber
          class="mono"
          formControlName="port"
          data-testid="host-port"
          [min]="1"
          [max]="65535"
        />
      </tui-textfield>
      <tui-error formControlName="port" />
    </div>
  </div>

  <div>
    <tui-textfield>
      <label tuiLabel>Username</label>
      <input tuiInput class="mono" formControlName="username" data-testid="host-username" />
    </tui-textfield>
    <tui-error formControlName="username" />
  </div>

  <fieldset class="auth">
    <legend>Authentication</legend>
    <tui-radio-list
      formControlName="authKind"
      data-testid="host-auth"
      [items]="authKinds"
      [itemContent]="authLabel"
    />
    <ng-template #authLabel let-kind>{{ label(kind) }}</ng-template>
  </fieldset>

  @if (isKey()) {
    <div>
      <tui-textfield>
        <label tuiLabel>Key path</label>
        <input
          tuiInput
          class="mono"
          formControlName="keyPath"
          placeholder="~/.ssh/id_ed25519"
          data-testid="host-key-path"
        />
      </tui-textfield>
      <tui-error formControlName="keyPath" />
    </div>
  }

  <footer>
    <button
      tuiButton
      appearance="secondary"
      type="button"
      data-testid="dialog-cancel"
      (click)="context.$implicit.complete()"
    >
      Cancel
    </button>
    <button tuiButton type="submit" data-testid="dialog-save" [loading]="saving()">Save</button>
  </footer>
</form>
