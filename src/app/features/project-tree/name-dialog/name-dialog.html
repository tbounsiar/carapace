<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <tui-textfield>
    <label tuiLabel>{{ 'projectTree.nameDialog.name' | transloco }}</label>
    <input
      tuiAutoFocus
      tuiInput
      formControlName="name"
      data-testid="name-input"
      [placeholder]="context.data.placeholder ?? ''"
    />
  </tui-textfield>
  <tui-error appErrorLink formControlName="name" />
  <footer>
    <button
      tuiButton
      appearance="secondary"
      type="button"
      data-testid="dialog-cancel"
      (click)="context.$implicit.complete()"
    >
      {{ 'common.cancel' | transloco }}
    </button>
    <button tuiButton type="submit" data-testid="dialog-save" [loading]="saving()">
      {{ 'common.save' | transloco }}
    </button>
  </footer>
</form>
