<div tuiNotification appearance="warning" size="s" icon="@tui.shield-alert">
  The authenticity of <span class="mono">{{ prompt.hostname }}:{{ prompt.port }}</span> cannot be
  established. Compare the fingerprint with one obtained from the server administrator before
  connecting.
</div>

<dl>
  <dt>Host</dt>
  <dd class="mono" data-testid="host-key-host">{{ prompt.hostname }}:{{ prompt.port }}</dd>
  <dt>Algorithm</dt>
  <dd class="mono">{{ prompt.algorithm }}</dd>
  <dt>Fingerprint</dt>
  <dd class="mono fingerprint" data-testid="fingerprint">{{ prompt.fingerprint }}</dd>
</dl>

<footer>
  <button
    tuiButton
    tuiAutoFocus
    appearance="secondary"
    type="button"
    data-testid="host-key-reject"
    (click)="context.completeWith(false)"
  >
    Reject
  </button>
  <button
    tuiButton
    type="button"
    data-testid="host-key-accept"
    (click)="context.completeWith(true)"
  >
    Accept and connect
  </button>
</footer>
