<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <p class="subject" data-testid="credential-subject">{{ data.subject }}</p>

  @if (data.error) {
    <div tuiNotification appearance="negative" size="s" data-testid="credential-error">
      {{ data.error }}
    </div>
  }

  <div>
    <tui-textfield>
      <label tuiLabel>{{ labelKey | transloco }}</label>
      <input
        tuiAutoFocus
        tuiInput
        type="password"
        autocomplete="off"
        formControlName="secret"
        data-testid="credential-secret"
      />
      <tui-icon tuiPassword />
    </tui-textfield>
    <tui-error appErrorLink formControlName="secret" />
  </div>

  @if (forTest) {
    <p class="note" data-testid="credential-test-note">
      {{ 'credentialDialog.testNote' | transloco }}
    </p>
  } @else {
    <label class="remember">
      <input
        tuiCheckbox
        type="checkbox"
        formControlName="remember"
        data-testid="credential-remember"
      />
      {{ 'credentialDialog.remember' | transloco }}
    </label>
  }

  <footer>
    <button
      tuiButton
      appearance="secondary"
      type="button"
      data-testid="credential-cancel"
      (click)="context.$implicit.complete()"
    >
      {{ 'common.cancel' | transloco }}
    </button>
    <button tuiButton type="submit" data-testid="credential-submit">
      {{ (forTest ? 'credentialDialog.test' : 'credentialDialog.connect') | transloco }}
    </button>
  </footer>
</form>
