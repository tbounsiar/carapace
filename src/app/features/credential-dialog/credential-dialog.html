<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <p class="subject" data-testid="credential-subject">{{ data.subject }}</p>

  @if (data.error) {
    <div tuiNotification appearance="negative" size="s" data-testid="credential-error">
      {{ data.error }}
    </div>
  }

  <div>
    <tui-textfield>
      <label tuiLabel>{{ label }}</label>
      <input
        tuiAutoFocus
        tuiInput
        type="password"
        autocomplete="off"
        formControlName="secret"
        data-testid="credential-secret"
      />
      <tui-icon tuiPassword />
    </tui-textfield>
    <tui-error formControlName="secret" />
  </div>

  <label class="remember">
    <input
      tuiCheckbox
      type="checkbox"
      formControlName="remember"
      data-testid="credential-remember"
    />
    Remember in the system keychain
  </label>

  <footer>
    <button
      tuiButton
      appearance="secondary"
      type="button"
      data-testid="credential-cancel"
      (click)="context.$implicit.complete()"
    >
      Cancel
    </button>
    <button tuiButton type="submit" data-testid="credential-submit">Connect</button>
  </footer>
</form>
