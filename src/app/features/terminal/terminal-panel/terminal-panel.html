@if (tabs().length) {
  <div class="bar">
    <tui-tabs
      size="m"
      class="tabs"
      [activeItemIndex]="activeIndex()"
      (activeItemIndexChange)="select($event)"
    >
      @for (tab of tabs(); track tab.key) {
        <button
          tuiTab
          type="button"
          aria-keyshortcuts="Delete"
          [attr.data-testid]="'terminal-tab-' + tab.n"
          (keydown.delete)="close(tab)"
        >
          Terminal {{ tab.n }}
          <tui-icon
            icon="@tui.x"
            class="close"
            [attr.aria-label]="'Close Terminal ' + tab.n"
            [attr.data-testid]="'terminal-close-' + tab.n"
            (click.stop)="close(tab)"
          />
        </button>
      }
    </tui-tabs>
    <button
      tuiButton
      appearance="secondary"
      size="s"
      iconStart="@tui.plus"
      type="button"
      data-testid="terminal-new"
      [loading]="busy()"
      (click)="newTerminal()"
    >
      New terminal
    </button>
  </div>

  @if (activeTab(); as tab) {
    @if (tab.state() === 'ended') {
      <div tuiNotification appearance="neutral" size="s" class="ended" data-testid="terminal-ended">
        <span>Session ended. {{ endedReason() }}</span>
        <button
          tuiButton
          appearance="secondary"
          size="xs"
          iconStart="@tui.rotate-ccw"
          type="button"
          data-testid="terminal-reopen"
          [loading]="busy()"
          (click)="reopen(tab)"
        >
          Reopen
        </button>
      </div>
    }
    <div #view class="view" [attr.data-testid]="'terminal-view-' + tab.n"></div>
  }
} @else {
  <tui-block-status size="m" data-testid="terminal-empty">
    <span tuiAvatar="@tui.square-terminal" size="l" tuiSlot="top"></span>
    <h2>No terminal open</h2>
    <p>Open a shell on this host. It connects first if needed.</p>
    <button
      tuiButton
      size="s"
      iconStart="@tui.plus"
      type="button"
      data-testid="terminal-new"
      [loading]="busy()"
      (click)="newTerminal()"
    >
      New terminal
    </button>
  </tui-block-status>
}
