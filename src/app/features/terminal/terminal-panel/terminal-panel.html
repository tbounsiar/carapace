@if (ended()) {
  <div
    tuiNotification
    size="s"
    class="ended"
    data-testid="terminal-ended"
    [appearance]="lost() ? 'warning' : 'neutral'"
  >
    <span>
      @if (lost()) {
        {{ 'terminal.panel.lost' | transloco }}
      } @else if (endedReason(); as reason) {
        {{ 'terminal.panel.endedWith' | transloco: { reason: reason | transloco } }}
      } @else {
        {{ 'terminal.panel.ended' | transloco }}
      }
    </span>
    <button
      tuiButton
      appearance="secondary"
      size="xs"
      iconStart="@tui.rotate-ccw"
      type="button"
      data-testid="terminal-reopen"
      [loading]="busy()"
      (click)="reopen()"
    >
      {{ 'terminal.panel.reopen' | transloco }}
    </button>
  </div>
}
<div #view class="view" [attr.data-testid]="'terminal-view-' + tab().n"></div>
