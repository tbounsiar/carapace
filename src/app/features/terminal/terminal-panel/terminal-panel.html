@if (ended()) {
  <div
    tuiNotification
    size="s"
    class="ended"
    data-testid="terminal-ended"
    [appearance]="lost() ? 'warning' : 'neutral'"
  >
    <span>{{ lost() ? 'Connection lost.' : 'Session ended. ' + endedReason() }}</span>
    <button
      tuiButton
      appearance="secondary"
      size="xs"
      iconStart="@tui.rotate-ccw"
      type="button"
      data-testid="terminal-reopen"
      [loading]="busy()"
      (click)="reopen()"
    >
      Reopen
    </button>
  </div>
}
<div #view class="view" [attr.data-testid]="'terminal-view-' + tab().n"></div>
