@if (tabs().length) {
  <div class="bar">
    <tui-tabs
      size="m"
      class="tabs"
      role="tablist"
      aria-label="Terminals"
      [activeItemIndex]="activeIndex()"
      (activeItemIndexChange)="select($event)"
    >
      @for (tab of tabs(); track tab.key) {
        <button
          tuiTab
          type="button"
          role="tab"
          aria-keyshortcuts="Delete"
          [id]="tabId(tab)"
          [attr.aria-selected]="tab === activeTab()"
          [attr.aria-controls]="tab === activeTab() ? panelId : null"
          [attr.data-testid]="'terminal-tab-' + tab.n"
          (keydown.delete)="close(tab)"
        >
          {{ title(tab) }}
          <tui-icon
            icon="@tui.x"
            class="close"
            [attr.aria-label]="'Close ' + title(tab)"
            [attr.data-testid]="'terminal-close-' + tab.n"
            (click.stop)="close(tab)"
          />
        </button>
      }
    </tui-tabs>
    <button
      tuiButton
      appearance="secondary"
      size="s"
      iconStart="@tui.plus"
      type="button"
      data-testid="terminal-new"
      [loading]="busy()"
      (click)="newTerminal()"
    >
      New terminal
    </button>
  </div>

  @if (activeTab(); as tab) {
    @if (tab.state() === 'ended') {
      <div tuiNotification appearance="neutral" size="s" class="ended" data-testid="terminal-ended">
        <span>Session ended. {{ endedReason() }}</span>
        <button
          tuiButton
          appearance="secondary"
          size="xs"
          iconStart="@tui.rotate-ccw"
          type="button"
          data-testid="terminal-reopen"
          [loading]="busy()"
          (click)="reopen(tab)"
        >
          Reopen
        </button>
      </div>
    }
    <div
      #view
      class="view"
      role="tabpanel"
      [id]="panelId"
      [attr.aria-labelledby]="tabId(tab)"
      [attr.data-testid]="'terminal-view-' + tab.n"
    ></div>
  }
} @else {
  <tui-block-status size="m" data-testid="terminal-empty">
    <span tuiAvatar="@tui.square-terminal" size="l" tuiSlot="top"></span>
    <h2>No terminal open</h2>
    <p>
      Open a shell on this host{{ envName() ? ' in ' + envName() : '' }}. It connects first if
      needed.
    </p>
    <button
      tuiButton
      size="s"
      iconStart="@tui.plus"
      type="button"
      data-testid="terminal-new"
      [loading]="busy()"
      (click)="newTerminal()"
    >
      New terminal
    </button>
  </tui-block-status>
}
