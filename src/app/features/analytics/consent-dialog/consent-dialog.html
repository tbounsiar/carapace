<p class="text" data-testid="consent-intro">
  {{ 'analytics.consent.intro' | transloco }}
</p>

@if (reAsk()) {
  <p class="text" data-testid="consent-reask">
    {{ 'analytics.consent.reask' | transloco }}
  </p>
}

<div tuiGroup orientation="vertical" [collapsed]="true">
  @for (category of categories; track category.id) {
    <label tuiBlock="m">
      <span tuiTitle>
        <span>
          {{ category.title | transloco }}
          @if (isNew(category.id)) {
            <span tuiBadge appearance="info" size="s">{{
              'analytics.consent.new' | transloco
            }}</span>
          }
        </span>
        <span
          tuiSubtitle
          [id]="'consent-' + category.id + '-note'"
          [attr.data-testid]="'consent-' + category.id + '-note'"
        >
          {{ category.note | transloco }}
        </span>
      </span>
      <input
        tuiSwitch
        type="checkbox"
        [tuiAutoFocus]="$first"
        [name]="category.id"
        [attr.aria-describedby]="'consent-' + category.id + '-note'"
        [attr.data-testid]="'consent-' + category.id"
        [ngModel]="choices()[category.id]"
        (ngModelChange)="set(category.id, $event)"
      />
    </label>
  }
</div>

<p class="text" data-testid="consent-common">
  <strong>{{ commonLead | transloco }}</strong> {{ commonText | transloco }}
</p>
<p class="text" data-testid="consent-never">
  <strong>{{ neverLead | transloco }}</strong> {{ neverText | transloco }}
  <button
    tuiLink
    type="button"
    iconEnd="@tui.external-link"
    data-testid="consent-privacy-link"
    [textContent]="'analytics.howItWorks' | transloco"
    (click)="openPolicy()"
  ></button>
</p>

<footer>
  <button
    tuiButton
    appearance="secondary"
    size="m"
    type="button"
    data-testid="consent-save"
    (click)="save()"
  >
    {{ 'analytics.consent.save' | transloco }}
  </button>
</footer>
