<span
  tuiDropdownAppearance=""
  [attr.tuiTheme]="theme()"
  [tuiDropdown]="menu"
  [tuiDropdownOpen]="open()"
  (tuiDropdownOpenChange)="open.set($event)"
>
  <button
    tuiIconButton
    appearance="secondary-grayscale"
    size="s"
    type="button"
    tuiHint="Theme"
    data-testid="theme-toggle"
    [iconStart]="current().icon"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'Theme: ' + current().label"
  >
    Theme
  </button>
</span>
<ng-template #menu>
  <tui-data-list size="s" role="menu" aria-label="Theme">
    @for (option of options; track option.mode) {
      <button
        tuiOption
        type="button"
        role="menuitemradio"
        [iconStart]="option.icon"
        [iconEnd]="isCurrent(option) ? '@tui.check' : ''"
        [attr.aria-checked]="isCurrent(option)"
        [attr.data-testid]="'theme-' + option.mode"
        (click)="choose(option)"
      >
        {{ option.label }}
      </button>
    }
  </tui-data-list>
</ng-template>
