<span
  tuiDropdownAppearance=""
  [tuiDropdown]="menu"
  [tuiDropdownOpen]="open()"
  (tuiDropdownOpenChange)="open.set($event)"
>
  <button
    tuiIconButton
    appearance="secondary-grayscale"
    size="s"
    type="button"
    [tuiHint]="'shell.themeMenu.hint' | transloco"
    data-testid="theme-toggle"
    [iconStart]="current().icon"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'shell.themeMenu.label' | transloco: { mode: (current().label | transloco) }"
  >
    {{ 'shell.themeMenu.hint' | transloco }}
  </button>
</span>
<ng-template #menu>
  <tui-data-list size="s" role="menu" [attr.aria-label]="'shell.themeMenu.hint' | transloco">
    @for (option of options; track option.mode) {
      <button
        tuiOption
        type="button"
        role="menuitemradio"
        [iconStart]="option.icon"
        [iconEnd]="isCurrent(option) ? '@tui.check' : ''"
        [attr.aria-checked]="isCurrent(option)"
        [attr.data-testid]="'theme-' + option.mode"
        (click)="choose(option)"
      >
        {{ option.label | transloco }}
      </button>
    }
  </tui-data-list>
</ng-template>
