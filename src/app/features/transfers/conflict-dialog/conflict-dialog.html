<div tuiNotification appearance="warning" size="s">
  @let parts = existsParts();
  {{ parts[0] }}<span class="mono" data-testid="conflict-name">{{ name }}</span
  >{{ parts[1] }}
</div>

<dl>
  <dt>{{ 'transfers.conflict.destination' | transloco }}</dt>
  <dd class="mono" data-testid="conflict-path">{{ conflict.path }}</dd>
  <dt>{{ 'transfers.conflict.existing' | transloco }}</dt>
  <dd data-testid="conflict-existing">{{ existing() }}</dd>
  <dt>{{ 'transfers.conflict.incoming' | transloco }}</dt>
  <dd data-testid="conflict-incoming">{{ incoming() }}</dd>
</dl>

<label class="all">
  <input tuiCheckbox type="checkbox" data-testid="conflict-all" [formControl]="applyToAll" />
  {{ 'transfers.conflict.applyToAll' | transloco }}
</label>

<footer>
  <button
    tuiButton
    size="m"
    appearance="flat-destructive"
    type="button"
    data-testid="conflict-overwrite"
    (click)="answer('overwrite')"
  >
    {{ 'transfers.conflict.overwrite' | transloco }}
  </button>
  <button
    tuiButton
    size="m"
    appearance="secondary"
    type="button"
    data-testid="conflict-skip"
    (click)="answer('skip')"
  >
    {{ 'transfers.conflict.skip' | transloco }}
  </button>
  <button
    tuiButton
    size="m"
    tuiAutoFocus
    type="button"
    data-testid="conflict-rename"
    (click)="answer('rename')"
  >
    {{ 'transfers.conflict.keepBoth' | transloco }}
  </button>
</footer>
