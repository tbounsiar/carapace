<section class="page" data-testid="welcome">
  @if (!loaded()) {
    <!-- Nothing until the config is known, so the empty state never flashes. -->
  } @else if (empty()) {
    <tui-block-status size="m" class="empty">
      <h1>Nothing here yet</h1>
      <p>Group hosts in a project to share variables between them, or add a host directly.</p>
      <button
        tuiButton
        appearance="primary"
        size="s"
        iconStart="@tui.folder-kanban"
        type="button"
        data-testid="welcome-new-project"
        (click)="createProject()"
      >
        New project
      </button>
      <button
        tuiButton
        appearance="secondary"
        size="s"
        iconStart="@tui.server"
        type="button"
        data-testid="welcome-add-host"
        (click)="addHost()"
      >
        Add host
      </button>
      <button
        tuiButton
        appearance="flat"
        size="s"
        iconStart="@tui.folder-plus"
        type="button"
        data-testid="welcome-new-collection"
        (click)="addCollection()"
      >
        New collection
      </button>
    </tui-block-status>
  } @else {
    <header tuiHeader>
      <hgroup tuiTitle>
        <h1>Home</h1>
        <p tuiSubtitle>Hosts and collections outside projects, and your projects.</p>
        <p tuiSubtitle data-testid="home-hint">{{ hint() }}</p>
      </hgroup>
    </header>
  }
</section>
