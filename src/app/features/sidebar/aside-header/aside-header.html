<tui-textfield
  tuiTextfieldSize="s"
  iconStart="@tui.search"
  class="filter"
  [tuiTextfieldCleaner]="true"
>
  <input
    #field
    tuiInput
    type="text"
    autocomplete="off"
    placeholder="Filter hosts"
    aria-label="Filter hosts"
    aria-controls="sidebar-tree"
    aria-keyshortcuts="Control+K"
    data-testid="sidebar-filter"
    [value]="filter.query()"
    [disabled]="!filter.enabled()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
</tui-textfield>
<span
  tuiDropdownAppearance=""
  [tuiDropdown]="menu"
  [tuiDropdownOpen]="newOpen()"
  (tuiDropdownOpenChange)="newOpen.set($event)"
>
  <button
    tuiIconButton
    appearance="secondary-grayscale"
    size="s"
    iconStart="@tui.plus"
    type="button"
    tuiHint="New"
    aria-label="New"
    data-testid="aside-new"
    [attr.aria-expanded]="newOpen()"
    [disabled]="!loaded()"
  >
    New
  </button>
</span>
<ng-template #menu>
  <tui-data-list size="s" role="menu" aria-label="New">
    <button
      tuiOption
      type="button"
      role="menuitem"
      iconStart="@tui.server"
      data-testid="new-host"
      (click)="newHost()"
    >
      New host
    </button>
    <button
      tuiOption
      type="button"
      role="menuitem"
      iconStart="@tui.folder-plus"
      data-testid="new-collection"
      (click)="newCollection()"
    >
      New collection
    </button>
    @if (isHome()) {
      <button
        tuiOption
        type="button"
        role="menuitem"
        iconStart="@tui.folder-kanban"
        data-testid="new-project"
        (click)="newProject()"
      >
        New project
      </button>
    }
  </tui-data-list>
</ng-template>
