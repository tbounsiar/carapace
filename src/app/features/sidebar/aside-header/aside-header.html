<tui-textfield
  tuiTextfieldSize="s"
  iconStart="@tui.search"
  class="filter"
  [tuiTextfieldCleaner]="true"
>
  <input
    #field
    tuiInput
    type="text"
    autocomplete="off"
    [placeholder]="'sidebar.filter' | transloco"
    [attr.aria-label]="'sidebar.filter' | transloco"
    aria-controls="sidebar-tree"
    aria-keyshortcuts="Control+K"
    data-testid="sidebar-filter"
    [disabled]="!filter.enabled()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
</tui-textfield>
<span
  tuiDropdownAppearance=""
  [tuiDropdown]="menu"
  [tuiDropdownOpen]="newOpen()"
  (tuiDropdownOpenChange)="newOpen.set($event)"
>
  <button
    tuiIconButton
    appearance="secondary-grayscale"
    size="s"
    iconStart="@tui.plus"
    type="button"
    [tuiHint]="'sidebar.new' | transloco"
    [attr.aria-label]="'sidebar.new' | transloco"
    data-testid="aside-new"
    [attr.aria-expanded]="newOpen()"
    [disabled]="!loaded()"
  >
    {{ 'sidebar.new' | transloco }}
  </button>
</span>
<ng-template #menu>
  <tui-data-list size="s" role="menu" [attr.aria-label]="'sidebar.new' | transloco">
    <button
      tuiOption
      type="button"
      role="menuitem"
      iconStart="@tui.server"
      data-testid="new-host"
      (click)="newHost()"
    >
      {{ 'sidebar.newHost' | transloco }}
    </button>
    <button
      tuiOption
      type="button"
      role="menuitem"
      iconStart="@tui.folder-plus"
      data-testid="new-collection"
      (click)="newCollection()"
    >
      {{ 'sidebar.newCollection' | transloco }}
    </button>
    @if (isHome()) {
      <button
        tuiOption
        type="button"
        role="menuitem"
        iconStart="@tui.folder-kanban"
        data-testid="new-project"
        (click)="newProject()"
      >
        {{ 'sidebar.newProject' | transloco }}
      </button>
    }
  </tui-data-list>
</ng-template>
