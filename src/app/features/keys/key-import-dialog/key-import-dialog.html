<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <tui-textfield>
    <label tuiLabel>Private key path</label>
    <input
      #pathInput
      tuiInput
      class="mono"
      autocomplete="off"
      placeholder="~/.ssh/id_ed25519"
      formControlName="path"
      data-testid="keyimport-path"
      [tuiAutoFocus]="!prefilled"
    />
    <button
      #browseButton
      tuiIconButton
      appearance="icon"
      size="xs"
      iconStart="@tui.folder-open"
      type="button"
      aria-label="Choose a key file"
      tuiHint="Choose a key file"
      data-testid="keyimport-browse"
      [disabled]="picking()"
      (click)="browse()"
    ></button>
    <tui-icon
      tuiTooltip="An OpenSSH private key. The file is not copied: it stays where it is and is only registered."
    />
  </tui-textfield>
  <tui-error appErrorLink formControlName="path" />

  <tui-textfield>
    <label tuiLabel>Name</label>
    <input
      tuiInput
      autocomplete="off"
      formControlName="name"
      data-testid="keyimport-name"
      [tuiAutoFocus]="prefilled"
    />
  </tui-textfield>
  <tui-error appErrorLink formControlName="name" />

  <tui-textfield>
    <label tuiLabel>Passphrase (optional)</label>
    <input
      tuiInput
      type="password"
      autocomplete="off"
      formControlName="passphrase"
      data-testid="keyimport-passphrase"
    />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error appErrorLink formControlName="passphrase" />
  <p class="note">Only needed to remember the passphrase of an encrypted key.</p>

  <label class="check">
    <input
      tuiCheckbox
      type="checkbox"
      formControlName="remember"
      data-testid="keyimport-remember"
    />
    Remember passphrase in the system keychain
  </label>

  <footer>
    <button tuiButton appearance="secondary" type="button" (click)="context.$implicit.complete()">
      Cancel
    </button>
    <button tuiButton type="submit" data-testid="keyimport-submit" [loading]="saving()">
      Import
    </button>
  </footer>
</form>
