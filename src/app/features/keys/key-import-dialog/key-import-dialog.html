<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <tui-textfield>
    <label tuiLabel>{{ 'keys.import.path' | transloco }}</label>
    <input
      #pathInput
      tuiInput
      class="mono"
      autocomplete="off"
      placeholder="~/.ssh/id_ed25519"
      formControlName="path"
      data-testid="keyimport-path"
      [tuiAutoFocus]="!prefilled"
    />
    <button
      #browseButton
      tuiIconButton
      appearance="icon"
      size="xs"
      iconStart="@tui.folder-open"
      type="button"
      [attr.aria-label]="'keys.import.chooseFile' | transloco"
      [tuiHint]="'keys.import.chooseFile' | transloco"
      data-testid="keyimport-browse"
      [disabled]="picking()"
      (click)="browse()"
    ></button>
    <tui-icon [tuiTooltip]="'keys.import.pathHint' | transloco" />
  </tui-textfield>
  <tui-error appErrorLink formControlName="path" />

  <tui-textfield>
    <label tuiLabel>{{ 'keys.fields.name' | transloco }}</label>
    <input
      tuiInput
      autocomplete="off"
      formControlName="name"
      data-testid="keyimport-name"
      [tuiAutoFocus]="prefilled"
    />
  </tui-textfield>
  <tui-error appErrorLink formControlName="name" />

  <tui-textfield>
    <label tuiLabel>{{ 'keys.fields.passphraseOptional' | transloco }}</label>
    <input
      tuiInput
      type="password"
      autocomplete="off"
      formControlName="passphrase"
      data-testid="keyimport-passphrase"
    />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error appErrorLink formControlName="passphrase" />
  <p class="note">{{ 'keys.import.passphraseNote' | transloco }}</p>

  <label class="check">
    <input
      tuiCheckbox
      type="checkbox"
      formControlName="remember"
      data-testid="keyimport-remember"
    />
    {{ 'keys.fields.rememberPassphrase' | transloco }}
  </label>

  <footer>
    <button tuiButton appearance="secondary" type="button" (click)="context.$implicit.complete()">
      {{ 'common.cancel' | transloco }}
    </button>
    <button tuiButton type="submit" data-testid="keyimport-submit" [loading]="saving()">
      {{ 'keys.import.submit' | transloco }}
    </button>
  </footer>
</form>
