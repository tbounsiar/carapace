<form tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
  <p class="note">
    @for (part of intro(); track $index) {
      @if (part.strong) {
        <strong [textContent]="part.text"></strong>
      } @else {
        <span [class.mono]="part.mono" [textContent]="part.text"></span>
      }
    }
  </p>

  <tui-textfield tuiChevron [stringify]="stringify" [tuiTextfieldCleaner]="false">
    <label tuiLabel>{{ 'keys.deploy.host' | transloco }}</label>
    <input
      tuiSelect
      [placeholder]="'keys.deploy.pickHost' | transloco"
      formControlName="hostId"
      data-testid="deploy-host"
    />
    <tui-data-list *tuiDropdown size="s" [emptyContent]="'keys.deploy.noHosts' | transloco">
      @for (group of groups(); track group.project?.id ?? null) {
        <tui-opt-group [label]="group.label">
          @for (host of group.hosts; track host.id) {
            <button
              tuiOption
              type="button"
              [value]="host.id"
              [attr.data-testid]="'deploy-host-option-' + host.name"
            >
              {{ label(host) }}
            </button>
          }
        </tui-opt-group>
      }
    </tui-data-list>
  </tui-textfield>
  <tui-error appErrorLink formControlName="hostId" />

  <label class="check">
    <input tuiCheckbox type="checkbox" formControlName="useKey" data-testid="deploy-use" />
    {{ 'keys.deploy.useKey' | transloco }}
  </label>
  <p class="note">
    @for (part of useKeyNote(); track $index) {
      @if (part.strong) {
        <strong [textContent]="part.text"></strong>
      } @else {
        <span [class.mono]="part.mono" [textContent]="part.text"></span>
      }
    }
  </p>

  <footer>
    <button tuiButton appearance="secondary" type="button" (click)="context.$implicit.complete()">
      {{ 'common.cancel' | transloco }}
    </button>
    <button tuiButton type="submit" data-testid="deploy-submit" [loading]="busy()">
      {{ 'keys.deploy.submit' | transloco }}
    </button>
  </footer>
</form>
