<p>{{ 'keys.delete.text' | transloco }}</p>
@if (generated) {
  <label tuiLabel>
    <input tuiCheckbox type="checkbox" data-testid="key-delete-files" [formControl]="deleteFiles" />
    <span tuiTitle>
      {{ 'keys.delete.deleteFiles' | transloco }}
      <span tuiSubtitle>
        <span class="mono path" data-testid="key-delete-path" [attr.title]="key.path">
          @for (part of parts; track $index) {
            <span class="part" [textContent]="part"></span><wbr />
          }
        </span>
        <span>
          {{ 'keys.delete.pubFile' | transloco: { file: fileName } }}
          @if (key.managed) {
            {{ 'keys.delete.managedNote' | transloco }}
          } @else {
            {{ 'keys.delete.sharedNote' | transloco }}
          }
        </span>
      </span>
    </span>
  </label>
} @else {
  <p class="note">
    {{ 'keys.delete.importedNote' | transloco }}
    <span class="mono path" data-testid="key-delete-path" [attr.title]="key.path">
      @for (part of parts; track $index) {
        <span class="part" [textContent]="part"></span><wbr />
      }
    </span>
  </p>
}
<footer>
  <button
    tuiAutoFocus
    tuiButton
    size="m"
    appearance="secondary"
    type="button"
    (click)="context.$implicit.complete()"
  >
    {{ 'common.cancel' | transloco }}
  </button>
  <button tuiButton size="m" appearance="primary-destructive" type="button" (click)="confirm()">
    {{ 'common.delete' | transloco }}
  </button>
</footer>
