<p class="content">{{ context.data.content }}</p>
<footer class="buttons">
  <button
    tuiAutoFocus
    tuiButton
    size="m"
    appearance="flat"
    type="button"
    (click)="context.completeWith(false)"
  >
    {{ context.data.no }}
  </button>
  <button
    tuiButton
    size="m"
    appearance="primary-destructive"
    type="button"
    (click)="context.completeWith(true)"
  >
    {{ context.data.yes }}
  </button>
</footer>
