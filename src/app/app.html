<tui-root [attr.tuiTheme]="effective()">
  <header tuiNavigationHeader [attr.tuiTheme]="effective()">
    <a tuiNavigationLogo routerLink="/" data-testid="home-link">
      <tui-icon icon="@tui.terminal" />
      Carapace
    </a>
    <app-project-select />
    <hr />
    <app-theme-menu />
  </header>
  <div class="body">
    <aside aria-label="Hosts" [tuiNavigationAside]="true" [attr.tuiTheme]="effective()">
      <header>
        <app-aside-header />
      </header>
      <app-sidebar-tree />
      <footer>
        <a
          tuiAsideItem
          iconStart="@tui.variable"
          routerLink="/variables"
          data-testid="global-variables"
          [attr.aria-current]="page() === '/variables' ? 'page' : null"
        >
          Global variables
        </a>
        <a
          tuiAsideItem
          iconStart="@tui.key-round"
          routerLink="/keys"
          data-testid="ssh-keys"
          [attr.aria-current]="page() === '/keys' ? 'page' : null"
        >
          SSH keys
        </a>
        <a
          tuiAsideItem
          iconStart="@tui.settings"
          routerLink="/settings"
          data-testid="settings"
          [attr.aria-current]="page() === '/settings' ? 'page' : null"
        >
          Settings
        </a>
      </footer>
    </aside>
    <main tuiNavigationMain>
      <nav tuiSubheader compact class="subheader">
        <app-location-bar />
      </nav>
      <ng-container #tabStrip />
      <router-outlet />
    </main>
  </div>
</tui-root>
