<tui-root [attr.tuiTheme]="effective()">
  <header tuiNavigationHeader [attr.tuiTheme]="effective()" [class._prod]="isProd()">
    <a tuiNavigationLogo routerLink="/" data-testid="home-link">
      <tui-icon icon="@tui.terminal" />
      Carapace
    </a>
    <hr />
    <app-env-select />
    <tui-segmented
      size="s"
      aria-label="Theme"
      data-testid="theme-toggle"
      [activeItemIndex]="activeIndex()"
      (activeItemIndexChange)="selectIndex($event)"
    >
      @for (option of themeOptions; track option.mode) {
        <button
          type="button"
          [class._active]="$index === activeIndex()"
          [attr.aria-pressed]="$index === activeIndex()"
          [attr.aria-label]="option.label"
          [attr.data-testid]="'theme-' + option.mode"
          [tuiHint]="option.label"
        >
          <tui-icon [icon]="option.icon" />
        </button>
      }
    </tui-segmented>
  </header>
  <div class="body">
    <aside aria-label="Projects" [tuiNavigationAside]="true" [attr.tuiTheme]="effective()">
      <app-project-tree />
      <footer>
        <a
          tuiButton
          appearance="flat-grayscale"
          size="s"
          iconStart="@tui.variable"
          routerLink="/variables"
          routerLinkActive="_active"
          ariaCurrentWhenActive="page"
          data-testid="global-variables"
        >
          Global variables
        </a>
      </footer>
    </aside>
    <main tuiNavigationMain>
      <router-outlet />
    </main>
  </div>
</tui-root>
