<tui-root [attr.tuiTheme]="effective()">
  <header tuiNavigationHeader [attr.tuiTheme]="effective()">
    <a tuiNavigationLogo routerLink="/" data-testid="home-link">
      <tui-icon icon="@tui.terminal" />
      Carapace
    </a>
    <app-project-select />
    <hr />
    <app-theme-menu />
  </header>
  <div class="body">
    <aside aria-label="Hosts" [tuiNavigationAside]="true" [attr.tuiTheme]="effective()">
      <header>
        <app-aside-header />
      </header>
      <app-sidebar-tree />
      <footer>
        @if (edited.count(); as count) {
          <a
            tuiAsideItem
            iconStart="@tui.external-link"
            routerLink="/edited-files"
            data-testid="aside-edited-files"
            [attr.aria-label]="editedLabel()"
            [attr.aria-current]="page() === '/edited-files' ? 'page' : null"
          >
            <span class="label">Edited files</span>
            @if (edited.attention(); as attention) {
              <span
                tuiBadge
                size="s"
                appearance="warning"
                iconStart="@tui.triangle-alert"
                data-testid="aside-edited-attention"
              >
                {{ attention }}
              </span>
            }
            <span tuiBadge size="s" appearance="neutral" data-testid="aside-edited-count">
              {{ count }}
            </span>
          </a>
        }
        <a
          tuiAsideItem
          iconStart="@tui.variable"
          routerLink="/variables"
          data-testid="global-variables"
          [attr.aria-current]="page() === '/variables' ? 'page' : null"
        >
          Global variables
        </a>
        <a
          tuiAsideItem
          iconStart="@tui.key-round"
          routerLink="/keys"
          data-testid="ssh-keys"
          [attr.aria-current]="page() === '/keys' ? 'page' : null"
        >
          SSH keys
        </a>
        <a
          tuiAsideItem
          iconStart="@tui.settings"
          routerLink="/settings"
          data-testid="settings"
          [attr.aria-current]="page() === '/settings' ? 'page' : null"
        >
          Settings
        </a>
      </footer>
    </aside>
    <main tuiNavigationMain>
      <nav tuiSubheader compact class="subheader">
        <app-location-bar />
      </nav>
      <ng-container #tabStrip />
      <router-outlet />
    </main>
  </div>
</tui-root>
